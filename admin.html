<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — BMBKK Walk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0a0a0b;
    --panel: #141416;
    --panel-2: #1c1c1f;
    --line: #2a2a2e;
    --white: #f7f6f3;
    --mute: #9b9a9f;
    --gold: #f5a623;
    --gold-deep: #c97b0e;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--black);
    color: var(--white);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .login-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 32px 24px;
    width: 100%;
    max-width: 400px;
    text-align: center;
  }
  .logo-img { height: 40px; margin-bottom: 16px; }
  h1 { font-family: 'Archivo Black', sans-serif; font-size: 22px; margin: 0 0 4px; text-transform: uppercase; }
  p.sub { color: var(--mute); font-size: 13px; margin: 0 0 24px; }
  .field { margin-bottom: 16px; text-align: left; }
  .field label { display: block; font-size: 12px; font-weight: 700; color: #c9c8c4; margin-bottom: 6px; }
  .field input {
    width: 100%; background: var(--panel-2); border: 1px solid var(--line);
    color: var(--white); padding: 12px 14px; border-radius: 8px; font-size: 14px; outline: none;
  }
  .field input:focus { border-color: var(--gold); }
  .btn {
    width: 100%; border: none; cursor: pointer;
    background: linear-gradient(135deg, var(--gold), var(--gold-deep));
    color: #1a1200; font-weight: 800; font-size: 15px; padding: 14px; border-radius: 8px; margin-top: 8px;
  }
  .msg { margin-top: 14px; font-size: 13px; padding: 10px; border-radius: 8px; display: none; }
  .msg.show { display: block; }
  .msg.error { background: rgba(220,60,60,0.15); border: 1px solid rgba(220,60,60,0.3); color: #ff9a9a; }
  
  .dashboard { display: none; width: 100%; max-width: 900px; }
  .dashboard.show { display: block; }
  .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .table-wrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
  table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
  th, td { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  th { background: var(--panel-2); color: var(--gold); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  .logout-btn { background: transparent; border: 1px solid var(--line); color: var(--mute); padding: 8px 16px; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>

<div class="login-card" id="loginCard">
  <img src="logo.png" alt="Logo" class="logo-img">
  <h1>Admin Login</h1>
  <p class="sub">Walk Registrations Dashboard</p>
  <form id="loginForm">
    <div class="field">
      <label>Email</label>
      <input type="email" id="email" required placeholder="admin@example.com">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" required placeholder="••••••••">
    </div>
    <button type="submit" class="btn" id="loginBtn">Log In</button>
    <div class="msg error" id="loginMsg"></div>
  </form>
</div>

<div class="dashboard" id="dashboard">
  <div class="header-bar">
    <h2>Walk Registrations</h2>
    <button class="logout-btn" id="logoutBtn">Log Out</button>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Phone</th>
          <th>Gender</th>
          <th>DOB</th>
          <th>Guests</th>
          <th>Attending</th>
          <th>Note</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="7" style="text-align:center; color:var(--mute);">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyDXP9X28_DWc10cJPZyiP50nJwIRUvRObs",
    authDomain: "bmbkk-walk-2026.firebaseapp.com",
    projectId: "bmbkk-walk-2026",
    storageBucket: "bmbkk-walk-2026.firebasestorage.app",
    messagingSenderId: "139718724275",
    appId: "1:139718724275:web:a7e1c0d971f37914d6bec6",
    measurementId: "G-JEERRLEQ50"
  };

  const app = initializeApp(FIREBASE_CONFIG);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const loginCard = document.getElementById("loginCard");
  const dashboard = document.getElementById("dashboard");
  const loginForm = document.getElementById("loginForm");
  const loginMsg = document.getElementById("loginMsg");
  const loginBtn = document.getElementById("loginBtn");

  onAuthStateChanged(auth, (user) => {
    if (user) {
      loginCard.style.display = "none";
      dashboard.classList.add("show");
      loadData();
    } else {
      loginCard.style.display = "block";
      dashboard.classList.remove("show");
    }
  });

  loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    loginMsg.classList.remove("show");
    loginBtn.disabled = true;
    loginBtn.textContent = "Logging in...";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (err) {
      console.error(err);
      loginMsg.textContent = "Incorrect email or password.";
      loginMsg.classList.add("show");
      loginBtn.disabled = false;
      loginBtn.textContent = "Log In";
    }
  });

  document.getElementById("logoutBtn").addEventListener("click", () => signOut(auth));

  async function loadData() {
    const tbody = document.getElementById("tableBody");
    try {
      const q = query(collection(db, "walk-registrations"), orderBy("createdAt", "desc"));
      const querySnapshot = await getDocs(q);
      if (querySnapshot.empty) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:var(--mute);">No registrations found.</td></tr>';
        return;
      }
      let html = "";
      querySnapshot.forEach((doc) => {
        const d = doc.data();
        html += `
          <tr>
            <td><strong>${d.name || '-'}</strong></td>
            <td>${d.phone || '-'}</td>
            <td>${d.gender || '-'}</td>
            <td>${d.dob || '-'}</td>
            <td>${d.guests || '1'}</td>
            <td>${d.attending || '-'}</td>
            <td>${d.note || '-'}</td>
          </tr>
        `;
      });
      tbody.innerHTML = html;
    } catch (err) {
      console.error(err);
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:#ff9a9a;">Error loading data. Check Firestore rules.</td></tr>';
    }
  }
</script>
</body>
</html>
